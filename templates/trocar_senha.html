  border: 1.5px solid #d1d9e6; border-radius: 10px;
  font-family: inherit; font-size: .9rem; color: #0f1f3d;
  outline: none; transition: border .15s, box-shadow .15s; margin-bottom: 1.1rem;
}
input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
.requisitos {
  background: #f8faff; border: 1px solid #dbeafe;
  border-radius: 10px; padding: .8rem 1rem; margin-bottom: 1.2rem;
  font-size: .75rem; color: #475569; line-height: 1.9;
}
.requisitos strong { color: #1d4ed8; display: block; margin-bottom: .2rem; }
.btn {
  width: 100%; padding: .8rem;
  background: linear-gradient(135deg, #002060, #2563eb);
  color: #fff; border: none; border-radius: 10px;
  font-family: inherit; font-size: .95rem; font-weight: 700;
  cursor: pointer; transition: opacity .15s, transform .1s;
}
.btn:hover { opacity: .92; transform: translateY(-1px); }
.erro {
  background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
  border-radius: 10px; padding: .7rem 1rem;
  font-size: .82rem; font-weight: 600; margin-bottom: 1.1rem;
}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="badge">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
        <circle cx="5" cy="5" r="4.5" stroke="#1d4ed8" stroke-width="1"/>
        <path d="M5 2.5v3l1.5 1.5" stroke="#1d4ed8" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      Primeiro acesso
    </div>
    <div class="title">Crie sua senha</div>
    <div class="subtitle">
      Olá, <strong>{{ nome }}</strong>! Por segurança, defina uma senha pessoal antes de continuar.
    </div>
  </div>

  <div class="divider"></div>

  {% if erro %}
  <div class="erro">{{ erro }}</div>
  {% endif %}

  <form method="POST">
    {% if via_token %}
    <input type="hidden" name="via_token" value="1">
    {% endif %}
    <label>Nova Senha</label>
    <input type="password" name="nova_senha" placeholder="Mínimo 6 caracteres" required autofocus>

    <label>Confirmar Senha</label>
    <input type="password" name="confirma_senha" placeholder="Repita a senha" required>

    <div class="requisitos">
      <strong>Requisitos:</strong>
      · Mínimo 6 caracteres<br>
      · Diferente da senha padrão<br>
      · As duas senhas devem ser iguais
    </div>

    <button type="submit" class="btn">Salvar e Entrar no Painel</button>
  </form>
</div>
</body>
</html>
