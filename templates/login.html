<title>Acesso aos Dashboards</title>

<style>
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Plus Jakarta Sans',sans-serif;
  background: linear-gradient(145deg, #001440 0%, #002060 60%, #003087 100%);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem;
}
.card {
  background:#fff; border-radius:22px;
  padding:2.4rem 2.2rem 2rem;
  width:100%; max-width:390px;
  box-shadow:0 28px 70px rgba(0,0,0,0.38);
}
.logo-area {
  display:flex; flex-direction:column; align-items:center;
  gap:.5rem; margin-bottom:1.8rem;
}
.logo-area img {
  width:200px; object-fit:contain;
}
.logo-sub {
  font-size:.75rem; color:#64748b; font-weight:500;
  text-align:center; line-height:1.4;
}
.divider { height:1px; background:#e8f0fe; margin-bottom:1.6rem; }
label {
  display:block; font-size:.72rem; font-weight:700; color:#374151;
  text-transform:uppercase; letter-spacing:.07em; margin-bottom:.38rem;
}
input {
  width:100%; padding:.7rem 1rem;
  border:1.5px solid #d1d9e6; border-radius:10px;
  font-family:inherit; font-size:.9rem; color:#0f1f3d;
  outline:none; transition:border .15s, box-shadow .15s;
  margin-bottom:1rem;
}
input:focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.1); }
.btn {
  width: 100%;
  padding: .82rem;
